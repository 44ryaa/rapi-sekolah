<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRS UI · 08 Pengaturan Profil & Kontak OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { height: 100vh; max-height: 100vh; overflow: hidden; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e8e2d5; }
    .card-real { background: #ffffff; border: 1.5px solid #ded6c8; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>
<body class="p-4 flex items-center justify-center h-screen box-border text-[#231b14]">

  <div class="max-w-2xl w-full card-real p-6 space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-[#e5ded2] text-xs">
      <a href="02-dashboard-calendar.html" class="font-bold flex items-center gap-1.5 text-[#15110e] hover:text-[#c87d32]"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
      <span class="font-black text-sm text-[#15110e]">Pengaturan Profil Pengguna</span>
      <span class="px-2.5 py-0.5 bg-blue-100 text-blue-900 rounded-full text-[10px] font-bold">Akun Saya</span>
    </div>

    <div class="flex items-center gap-3 pb-3 border-b border-[#e5ded2]">
      <div class="w-12 h-12 rounded-2xl bg-[#15110e] text-[#dfd9ce] flex items-center justify-center text-xl font-black shadow-md">
        O
      </div>
      <div>
        <h2 class="text-base font-extrabold text-[#15110e]">Organisasi Siswa Intra Sekolah (OSIS)</h2>
        <span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-800 rounded-md text-[10px] font-bold">Role: Organisasi</span>
      </div>
    </div>

    <form class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-[#5c5347] mb-1">Nomor WhatsApp Aktif (OTP)</label>
          <div class="relative">
            <input type="text" value="0895611029000" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl font-bold bg-[#faf8f4] text-[#15110e]">
            <span class="absolute right-2.5 top-2 text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-bold">Aktif</span>
          </div>
        </div>
        <div>
          <label class="block font-bold text-[#5c5347] mb-1">Alamat Email Notifikasi</label>
          <div class="relative">
            <input type="email" value="aryagaming188@gmail.com" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl font-bold bg-[#faf8f4] text-[#15110e]">
            <span class="absolute right-2.5 top-2 text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-bold">Aktif</span>
          </div>
        </div>
      </div>

      <div class="pt-2 border-t border-[#e5ded2] space-y-2">
        <h3 class="font-extrabold text-xs text-[#15110e]">Ganti Kata Sandi</h3>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-[#5c5347] mb-1">Kata Sandi Baru</label>
            <input type="password" placeholder="Minimal 6 karakter" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-white">
          </div>
          <div>
            <label class="block font-bold text-[#5c5347] mb-1">Ulangi Sandi</label>
            <input type="password" placeholder="Ketik ulang sandi" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-white">
          </div>
        </div>
      </div>

      <div class="pt-1">
        <button type="button" class="w-full py-2.5 bg-[#15110e] text-white rounded-xl font-bold hover:bg-[#251e18] transition shadow">
          Simpan Perubahan Akun
        </button>
      </div>
    </form>
  </div>

</body>
</html>
