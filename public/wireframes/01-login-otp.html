<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRS UI · 01 Login & Verifikasi OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { height: 100vh; max-height: 100vh; overflow: hidden; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e8e2d5; }
    .card-real { background: #ffffff; border: 1.5px solid #ded6c8; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>
<body class="flex items-center justify-center h-screen p-4 box-border text-[#231b14]">

  <div class="w-full max-w-md card-real p-7 space-y-4">
    <!-- Header Brand Asli -->
    <div class="text-center space-y-1.5">
      <div class="w-12 h-12 rounded-2xl bg-[#dfd9ce] flex items-center justify-center text-[#15110e] text-xl font-bold mx-auto shadow-md">
        <i class="fa-solid fa-shapes"></i>
      </div>
      <h1 class="text-xl font-extrabold text-[#15110e] tracking-tight">RAPI-Sekolah</h1>
      <p class="text-xs text-[#7d7367]">Sistem Sarpras Terpadu · Masuk Akun</p>
    </div>

    <!-- Login Form Asli -->
    <form class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-[#5c5347] mb-1">Username / ID Pengguna</label>
        <input type="text" value="admin" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-[#faf8f4] font-semibold text-[#15110e]">
      </div>
      <div>
        <label class="block font-bold text-[#5c5347] mb-1">Kata Sandi</label>
        <input type="password" value="••••••••" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-[#faf8f4] font-semibold text-[#15110e]">
      </div>
      <button type="button" class="w-full py-2.5 bg-[#15110e] text-white rounded-xl font-bold hover:bg-[#251e18] transition shadow">
        Masuk ke Sistem
      </button>
    </form>

    <!-- OTP Section Asli (WhatsApp & Gmail) -->
    <div class="pt-3 border-t border-[#e5ded2]">
      <div class="p-3 bg-[#faf7f2] rounded-xl border border-amber-200/80 space-y-2 text-center">
        <div class="flex items-center justify-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-[10px] font-bold text-amber-900 uppercase">Verifikasi OTP Otomatis</span>
        </div>
        <p class="text-[11px] text-[#7d7367]">Kode OTP dikirim otomatis via WhatsApp & Gmail</p>
        <div class="flex justify-center gap-1.5">
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">4</span>
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">8</span>
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">2</span>
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">9</span>
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">1</span>
          <span class="w-7 h-9 border-2 border-[#c87d32] bg-amber-50/60 rounded-lg flex items-center justify-center font-extrabold text-sm text-[#15110e]">5</span>
        </div>
        <button class="w-full py-1.5 bg-[#c87d32] text-white rounded-lg font-bold text-xs hover:bg-[#b06a28]">Konfirmasi & Reset Sandi</button>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="text-center text-[11px] text-[#7d7367]">
      <p>Siswa atau tamu tidak perlu login. <a href="02-agenda-publik.html" class="font-bold underline text-[#15110e]">Lihat Agenda Publik &rarr;</a></p>
    </div>
  </div>

</body>
</html>
