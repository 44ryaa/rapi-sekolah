<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRS UI · 03 Form Pengajuan Pinjam Ruang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { height: 100vh; max-height: 100vh; overflow: hidden; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e8e2d5; }
    .card-real { background: #ffffff; border: 1.5px solid #ded6c8; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>
<body class="p-4 flex items-center justify-center h-screen box-border text-[#231b14]">

  <div class="max-w-2xl w-full card-real p-6 space-y-4">
    <!-- Top Nav -->
    <div class="flex items-center justify-between pb-3 border-b border-[#e5ded2] text-xs">
      <a href="02-dashboard-calendar.html" class="font-bold flex items-center gap-1.5 text-[#15110e] hover:text-[#c87d32]"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
      <span class="font-black text-sm text-[#15110e]">Formulir Booking Ruang</span>
      <span class="px-2.5 py-0.5 bg-amber-100 text-amber-900 rounded-full text-[10px] font-bold">Guru & Organisasi</span>
    </div>

    <div>
      <h2 class="text-base font-extrabold text-[#15110e]">Ajukan Peminjaman Ruangan</h2>
      <p class="text-[11px] text-[#7d7367]">Otorisasi diverifikasi dan disetujui langsung oleh Waka Sarpras.</p>
    </div>

    <form class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-[#5c5347] mb-1">Pilih Ruangan Fasilitas</label>
        <select class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-[#faf8f4] font-semibold text-[#15110e]">
          <option>Lab Komputer 1 (Kapasitas: 36 Orang · PIC: Budi Santoso)</option>
          <option>Aula Utama Pertemuan (Kapasitas: 200 Orang)</option>
          <option>Ruang Multimedia Audio Visual (Kapasitas: 40 Orang)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-[#5c5347] mb-1">Tanggal Kegiatan</label>
          <input type="date" value="2026-11-04" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-[#faf8f4] font-medium text-[#15110e]">
          <span class="text-[9px] text-[#8e8477] mt-0.5 block">Minimal H-1 sebelum kegiatan.</span>
        </div>
        <div>
          <label class="block font-bold text-[#5c5347] mb-1">Pilihan Sesi</label>
          <div class="grid grid-cols-2 gap-1.5">
            <button type="button" class="py-2 bg-[#15110e] text-white rounded-xl font-bold shadow-sm">Sesi Parsial</button>
            <button type="button" class="py-2 border border-[#ddd5c7] bg-white rounded-xl font-bold hover:bg-gray-50">Sesi Penuh</button>
          </div>
        </div>
      </div>

      <div>
        <label class="block font-bold text-[#5c5347] mb-1">Pilih Sesi Jam Pelajaran (07:00 - 16:00)</label>
        <div class="grid grid-cols-6 gap-1.5 text-center">
          <button type="button" class="p-1.5 border border-gray-200 rounded-lg bg-gray-100 text-gray-400 font-bold" disabled>S1 (Terisi)</button>
          <button type="button" class="p-1.5 border border-[#c87d32] bg-[#c87d32] text-white rounded-lg font-bold shadow-sm">S2 (Dipilih)</button>
          <button type="button" class="p-1.5 border border-[#c87d32] bg-[#c87d32] text-white rounded-lg font-bold shadow-sm">S3 (Dipilih)</button>
          <button type="button" class="p-1.5 border border-[#ddd5c7] bg-white rounded-lg font-bold hover:bg-amber-50/50">S4</button>
          <button type="button" class="p-1.5 border border-[#ddd5c7] bg-white rounded-lg font-bold hover:bg-amber-50/50">S5</button>
          <button type="button" class="p-1.5 border border-[#ddd5c7] bg-white rounded-lg font-bold hover:bg-amber-50/50">S6</button>
        </div>
      </div>

      <div>
        <label class="block font-bold text-[#5c5347] mb-1">Nama Kegiatan & Keperluan</label>
        <textarea rows="2" class="w-full px-3 py-2 border border-[#ddd5c7] rounded-xl bg-white" placeholder="Contoh: Rapat Koordinasi LDKS OSIS"></textarea>
      </div>

      <div class="pt-1 flex gap-2">
        <button type="button" class="flex-1 py-2.5 bg-[#15110e] text-white font-bold rounded-xl hover:bg-[#251e18] transition shadow">
          Kirimkan Pengajuan Peminjaman
        </button>
      </div>
    </form>
  </div>

</body>
</html>
