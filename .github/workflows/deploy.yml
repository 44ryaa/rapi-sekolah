name: CI/CD Fast Deploy to cPanel DomaiNesia

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Turbo Sync ke Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Deploy Laravel Core via FTP (Fast Sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /home/rapiseko/rapi-sekolah/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            .env
            .env.*
            storage/logs/*.log
            storage/framework/cache/**
            storage/framework/views/**
            storage/framework/sessions/**

      - name: 3. Deploy Public Assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: /home/rapiseko/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            storage/**

      - name: 4. Eksekusi Sinkronisasi Database & Bersihkan Cache Server
        run: |
          echo "Memanggil deploy hook di server..."
          curl -s -L "https://rapi-sekolah.web.id/deploy_update_all.php" || true
          echo "Selesai! Web rapi-sekolah.web.id telah diperbarui secara otomatis."
